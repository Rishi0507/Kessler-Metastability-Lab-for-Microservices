global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api1:9001", "api2:9001", "api3:9001"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway1:9101", "gateway2:9101"]
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler1:9201", "scheduler2:9201"]
  - job_name: worker
    static_configs:
      - targets: ["worker1:9301", "worker2:9301"]
