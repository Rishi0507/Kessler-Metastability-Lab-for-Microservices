include mime.types;
default_type application/octet-stream;
server_tokens off;

log_format kessler_json escape=json
    '{"ts":"$time_iso8601","edge":"$hostname:$server_port","request_id":"$req_id",'
    '"client":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,"upstream":"$upstream_addr",'
    '"upstream_time":"$upstream_response_time","cache":"$upstream_cache_status"}';
access_log logs/access.log kessler_json;

sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65s;
keepalive_requests 1000;
client_max_body_size 256k;
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 30s;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types application/json application/problem+json application/javascript text/css text/plain image/svg+xml;

set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header proxy_protocol;

map $http_x_request_id $req_id {
    default $request_id;
    "~^[A-Za-z0-9-]{8,64}$" $http_x_request_id;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

map $request_method $submit_key {
    POST $binary_remote_addr;
    default "";
}
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=20r/m;
limit_req_zone $submit_key zone=submit_ip:10m rate=40r/m;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
limit_req_status 429;
limit_conn_status 429;

proxy_cache_path cache/api levels=1:2 keys_zone=api_cache:10m max_size=256m inactive=1h use_temp_path=off;

include upstreams.conf;
