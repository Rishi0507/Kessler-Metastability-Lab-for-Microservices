include web-root.conf;
index index.html;
limit_conn conn_ip 100;

location = /edge-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location = /metrics {
    return 404;
}

location ~ ^/(healthz|readyz)$ {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny all;
    include snippets/proxy-api.conf;
}

location /api/ {
    limit_req zone=per_ip burst=80 nodelay;
    include snippets/proxy-api.conf;
}

location /api/v1/auth/ {
    limit_req zone=auth_ip burst=10 nodelay;
    include snippets/proxy-api.conf;
}

location ~ ^/api/v1/(analyses|runs)$ {
    limit_req zone=submit_ip burst=15 nodelay;
    limit_req zone=per_ip burst=80 nodelay;
    include snippets/proxy-api.conf;
}

location = /api/v1/platform/kpis {
    include snippets/proxy-api.conf;
    proxy_cache api_cache;
    proxy_cache_valid 200 2s;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout http_502 http_503;
    add_header X-Cache $upstream_cache_status always;
    include snippets/security-headers.conf;
}

location ~ ^/api/v1/reports/[A-Za-z0-9_-]+$ {
    include snippets/proxy-api.conf;
    proxy_cache api_cache;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 10s;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
    include snippets/security-headers.conf;
}

location = /api/v1/templates {
    include snippets/proxy-api.conf;
    proxy_cache api_cache;
    proxy_cache_valid 200 5m;
    add_header X-Cache $upstream_cache_status always;
    include snippets/security-headers.conf;
}

location = /ws {
    limit_conn conn_ip 20;
    proxy_pass http://gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}

location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include snippets/security-headers.conf;
}

location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    include snippets/security-headers.conf;
}
