worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events { worker_connections 1024; }

stream {
    log_format l4 '$time_iso8601 $remote_addr -> $upstream_addr $status $bytes_sent/$bytes_received ${session_time}s';
    access_log logs/l4.log l4;

    include l4-upstreams.conf;

    server {
        include l4-listen.conf;
        proxy_pass edges;
        proxy_protocol on;
        proxy_connect_timeout 1s;
        proxy_timeout 1h;
        proxy_next_upstream on;
        proxy_next_upstream_tries 2;
    }
}
