upstream api {
    least_conn;
    server api1:9001 max_fails=3 fail_timeout=10s;
    server api2:9001 max_fails=3 fail_timeout=10s;
    server api3:9001 max_fails=3 fail_timeout=10s;
    keepalive 64;
    keepalive_timeout 60s;
}

upstream gateway {
    least_conn;
    server gateway1:9101 max_fails=3 fail_timeout=10s;
    server gateway2:9101 max_fails=3 fail_timeout=10s;
}
