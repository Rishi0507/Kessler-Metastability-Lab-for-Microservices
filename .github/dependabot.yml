version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/deploy/docker]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        versions: [">=3.13"]
      - dependency-name: node
        versions: [">=23"]
