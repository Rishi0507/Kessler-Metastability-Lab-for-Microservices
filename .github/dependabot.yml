version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web-minor:
        update-types: [minor, patch]
      web-major:
        update-types: [major]
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/deploy/docker]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        versions: [">=3.13"]
      - dependency-name: node
        versions: [">=23"]
