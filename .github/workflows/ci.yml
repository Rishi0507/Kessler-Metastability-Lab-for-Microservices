name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (C++20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build (Release)
        run: cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build engine/build
      - name: Unit, queueing-theory and resilience tests
        run: ./engine/build/kessler-tests
      - name: Benchmark (informational)
        run: ./engine/build/kessler-sim bench --sims 4
      - uses: actions/upload-artifact@v4
        with:
          name: engine-linux
          path: engine/build/libkessler_engine.so

  engine-sanitizers:
    name: engine (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S engine -B engine/build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKESSLER_SANITIZE=ON && cmake --build engine/build-asan
      - run: ./engine/build-asan/kessler-tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  backend:
    name: backend (Python 3.12)
    runs-on: ubuntu-latest
    needs: engine
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kessler
          POSTGRES_PASSWORD: kessler
          POSTGRES_DB: kessler
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kessler" --health-interval 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      KESSLER_DATABASE_URL: postgresql://kessler:kessler@127.0.0.1:5432/kessler
      KESSLER_REDIS_URL: redis://127.0.0.1:6379/0
      KESSLER_ENGINE_PATH: ${{ github.workspace }}/engine/build/libkessler_engine.so
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-linux
          path: engine/build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.in -r backend/requirements-dev.in -c backend/requirements.lock
      - name: Lint
        run: ruff check backend
      - name: Migrations apply cleanly
        run: python -m kessler.migrate
        working-directory: backend
      - name: Tests
        run: pytest -q
        working-directory: backend

  web:
    name: web (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build

  images:
    name: container images
    runs-on: ubuntu-latest
    needs: [engine, backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/backend.Dockerfile -t kessler/backend:ci .
      - run: docker build -f deploy/docker/edge.Dockerfile -t kessler/edge:ci .
